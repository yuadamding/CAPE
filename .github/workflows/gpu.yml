name: Scheduled GPU qualification

on:
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * 0"

permissions:
  contents: read

jobs:
  cuda-smoke:
    runs-on: [self-hosted, linux, gpu]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: yuadamding/CREDO
          ref: 6f4f57c114606476cb6e93c6d52dc34628173a4d
          path: CREDO
      - run: python -m pip install -e '.[test]'
      - name: CUDA lifecycle and memory guard
        env:
          CREDO_V4_WORKSPACE_ROOT: ${{ github.workspace }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: pytest -q -m gpu tests/gpu
