name: CPU CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: yuadamding/CREDO
          ref: 6f4f57c114606476cb6e93c6d52dc34628173a4d
          path: CREDO
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - name: Frozen dependency preflight
        env:
          CREDO_V4_WORKSPACE_ROOT: ${{ github.workspace }}
        run: credo-v4 audit
      - run: ruff format --check src tests scripts
      - run: ruff check src tests scripts
      - run: mypy src/credo_count_sde_v4
      - run: python scripts/check_generated_schemas.py
      - run: python scripts/check_docs.py
      - name: Tests and branch coverage
        env:
          CREDO_V4_WORKSPACE_ROOT: ${{ github.workspace }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: pytest -q -p no:cacheprovider --cov=credo_count_sde_v4 --cov-report=term-missing --cov-fail-under=85
      - run: python -m build
      - run: python scripts/audit_package.py dist/*.whl

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: yuadamding/CREDO
          ref: 6f4f57c114606476cb6e93c6d52dc34628173a4d
          path: CREDO
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build
      - run: python -m venv wheel-env
      - run: wheel-env/bin/pip install dist/*.whl
      - name: Wheel-only lifecycle
        env:
          CREDO_V4_WORKSPACE_ROOT: ${{ github.workspace }}
        run: |
          wheel-env/bin/credo-v4 synthetic --output /tmp/v4-wheel --updates 4
          wheel-env/bin/credo-v4 run-all /tmp/v4-wheel/config.yaml --device cpu
          wheel-env/bin/credo-v4 verify /tmp/v4-wheel/work/sealed --level full
